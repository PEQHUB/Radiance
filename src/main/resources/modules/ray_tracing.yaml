name: "render_pipeline.module.ray_tracing.name"
inputImageConfigs: [ ]
outputImageConfigs:
  - name: "radiance"
    format: "R32G32B32A32_SFLOAT"
  - name: "diffuse_albedo_metallic"
    format: "R8G8B8A8_UNORM"
  - name: "specular_albedo"
    format: "R8G8B8A8_UNORM"
  - name: "normal_roughness"
    format: "R32G32B32A32_SFLOAT"
  - name: "motion_vector"
    format: "R32G32_SFLOAT"
  - name: "linear_depth"
    format: "R32_SFLOAT"
  - name: "specular_hit_depth"
    format: "R32_SFLOAT"
  - name: "first_hit_depth"
    format: "R16_SFLOAT"
  - name: "first_hit_diffuse_direct_light"
    format: "R16G16B16A16_SFLOAT"
  - name: "first_hit_diffuse_indirect_light"
    format: "R16G16B16A16_SFLOAT"
  - name: "first_hit_specular"
    format: "R16G16B16A16_SFLOAT"
  - name: "first_hit_clear"
    format: "R16G16B16A16_SFLOAT"
  - name: "first_hit_base_emission"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_light_depth"
    format: "R16_SFLOAT"
  - name: "diffuse_ray_dir_hit_dist"
    format: "R16G16B16A16_SFLOAT"
  - name: "specular_ray_dir_hit_dist"
    format: "R16G16B16A16_SFLOAT"
  - name: "reflection_mv"
    format: "R32G32_SFLOAT"
  - name: "animated_tex_mask"
    format: "R16_SFLOAT"
  - name: "particle_mask"
    format: "R16_SFLOAT"
  - name: "bias_mask"
    format: "R16_SFLOAT"
  - name: "rt_hit_dist"
    format: "R16_SFLOAT"
  - name: "motion_vectors_3d"
    format: "R16G16B16A16_SFLOAT"
  - name: "gbuffer_metallic"
    format: "R16_SFLOAT"
  - name: "gbuffer_shading_model_id"
    format: "R16_SFLOAT"
  - name: "gbuffer_material_id"
    format: "R16_SFLOAT"
  - name: "position_view_space"
    format: "R32G32B32A32_SFLOAT"
  - name: "transparency_layer"
    format: "R16G16B16A16_SFLOAT"
  - name: "transparency_layer_opacity"
    format: "R16G16B16A16_SFLOAT"
  - name: "transparency_layer_mvecs"
    format: "R32G32_SFLOAT"
attributeConfigs:
  - name: "render_pipeline.module.ray_tracing.attribute.num_ray_bounces"
    type: "int_range:1-12"
    value: "4"
  - name: "render_pipeline.module.ray_tracing.attribute.use_jitter"
    type: "bool"
    value: "true"