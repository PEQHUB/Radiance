name: "render_pipeline.module.tone_mapping.name"
inputImageConfigs:
  - name: "denoised_radiance"
    format: "R32G32B32A32_SFLOAT"
outputImageConfigs:
  - name: "mapped_output"
    format: "R8G8B8A8_UNORM"
attributeConfigs:
  - name: "render_pipeline.module.tone_mapping.attribute.tonemap_mode"
    type: "enum:pbr_neutral-reinhard_extended"
    value: "reinhard_extended"
  - name: "render_pipeline.module.tone_mapping.attribute.middle_grey"
    type: "float_range:0.0-1.0"
    value: "0.18"
  - name: "render_pipeline.module.tone_mapping.attribute.lwhite"
    type: "float_range:1.0-20.0"
    value: "4.0"
