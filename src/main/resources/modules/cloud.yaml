name: "render_pipeline.module.cloud.name"
inputImageConfigs:
  - name: "radiance"
    format: "R32G32B32A32_SFLOAT"
  - name: "linear_depth"
    format: "R32_SFLOAT"
outputImageConfigs:
  - name: "cloud_radiance"
    format: "R32G32B32A32_SFLOAT"
attributeConfigs:
  - name: "render_pipeline.module.cloud.attribute.quality"
    type: "enum:off-low-medium-high-ultra-extreme"
    value: "high"
  - name: "render_pipeline.module.cloud.attribute.density"
    type: "float_range:0.1-3.0"
    value: "1.0"
  - name: "render_pipeline.module.cloud.attribute.coverage"
    type: "float_range:0.0-1.0"
    value: "0.35"
  - name: "render_pipeline.module.cloud.attribute.altitude"
    type: "float_range:128.0-320.0"
    value: "192.0"
  - name: "render_pipeline.module.cloud.attribute.thickness"
    type: "float_range:32.0-128.0"
    value: "64.0"
  - name: "render_pipeline.module.cloud.attribute.speed"
    type: "float_range:0.0-5.0"
    value: "1.0"
