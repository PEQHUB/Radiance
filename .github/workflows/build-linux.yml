name: Build Platform JARs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} JAR
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout Radiance
        uses: actions/checkout@v4
        with:
          path: Radiance

      - name: Checkout MCVR
        uses: actions/checkout@v4
        with:
          repository: PEQHUB/MCVR
          path: MCVR
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslangValidator --version

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $sdkRoots = @()

          if (Test-Path "C:\VulkanSDK") {
              $sdkRoots += Get-ChildItem "C:\VulkanSDK" -Directory
          }

          if ($sdkRoots.Count -eq 0) {
              winget install --id KhronosGroup.VulkanSDK --exact --silent --accept-package-agreements --accept-source-agreements

              if (Test-Path "C:\VulkanSDK") {
                  $sdkRoots += Get-ChildItem "C:\VulkanSDK" -Directory
              }

              if (Test-Path "C:\Program Files\VulkanSDK") {
                  $sdkRoots += Get-ChildItem "C:\Program Files\VulkanSDK" -Directory
              }
          }

          $vkRoot = $sdkRoots | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $vkRoot) {
              throw "Vulkan SDK installation directory was not found"
          }

          $vkBin = Join-Path $vkRoot.FullName "Bin"
          $validator = Join-Path $vkBin "glslangValidator.exe"
          if (-not (Test-Path $validator)) {
              throw "glslangValidator.exe was not found at $validator"
          }

          $vkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VULKAN_SDK=$($vkRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_SDK_PATH=$($vkRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $validator --version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate JNI headers (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd "${{ github.workspace }}/Radiance"
          chmod +x gradlew
          ./gradlew compileJava --no-daemon

          HEADER_COUNT=$(find "${{ github.workspace }}/Radiance/src/main/native/include" -name '*.h' | wc -l)
          echo "Generated $HEADER_COUNT JNI headers"
          if [ "$HEADER_COUNT" -eq 0 ]; then
            echo "ERROR: No JNI headers generated"
            exit 1
          fi

      - name: Generate JNI headers (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\Radiance"
          .\gradlew.bat compileJava --no-daemon

          $headers = Get-ChildItem "$env:GITHUB_WORKSPACE\Radiance\src\main\native\include" -Filter *.h -Recurse
          $headerCount = $headers.Count
          Write-Host "Generated $headerCount JNI headers"
          if ($headerCount -eq 0) {
              throw "No JNI headers generated"
          }

      - name: Build MCVR native library and shaders (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd "${{ github.workspace }}/MCVR"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DJAVA_PROJECT_ROOT_DIR="${{ github.workspace }}/Radiance" \
            -DUSE_AMD=ON \
            -DMCVR_ENABLE_NRD=ON \
            -DMCVR_ENABLE_FFX_UPSCALER=ON
          cmake --build build --parallel "$(nproc)"
          cmake --install build

      - name: Build MCVR native library and shaders (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\MCVR"
          $javaRoot = "$env:GITHUB_WORKSPACE\Radiance" -replace '\\', '/'

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DJAVA_PROJECT_ROOT_DIR=$javaRoot `
            -DUSE_AMD=ON `
            -DMCVR_ENABLE_NRD=ON `
            -DMCVR_ENABLE_FFX_UPSCALER=ON

          cmake --build build --config Release --parallel
          cmake --install build --config Release

      - name: Verify and stage natives (Linux)
        if: matrix.platform == 'linux'
        run: |
          SHADER_COUNT=$(find "${{ github.workspace }}/Radiance/src/main/resources/shaders" -name '*.spv' | wc -l)
          echo "Total SPIR-V shaders: $SHADER_COUNT"
          if [ "$SHADER_COUNT" -eq 0 ]; then
            echo "ERROR: No shaders were compiled"
            exit 1
          fi

          if [ ! -f "${{ github.workspace }}/Radiance/src/main/resources/libcore.so" ]; then
            echo "ERROR: libcore.so not found"
            exit 1
          fi

          mkdir -p "${{ github.workspace }}/Radiance/natives/linux"
          mv "${{ github.workspace }}/Radiance/src/main/resources/libcore.so" \
             "${{ github.workspace }}/Radiance/natives/linux/libcore.so"

      - name: Verify and stage natives (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $resourceDir = "$env:GITHUB_WORKSPACE\Radiance\src\main\resources"
          $shaderCount = (Get-ChildItem "$resourceDir\shaders" -Filter *.spv -Recurse | Measure-Object).Count
          Write-Host "Total SPIR-V shaders: $shaderCount"
          if ($shaderCount -eq 0) {
              throw "No shaders were compiled"
          }

          $dllPath = Join-Path $resourceDir "core.dll"
          $libPath = Join-Path $resourceDir "core.lib"
          if (-not (Test-Path $dllPath)) {
              throw "core.dll was not found in $resourceDir"
          }
          if (-not (Test-Path $libPath)) {
              throw "core.lib was not found in $resourceDir"
          }

          $nativeDir = "$env:GITHUB_WORKSPACE\Radiance\natives\windows"
          New-Item -ItemType Directory -Path $nativeDir -Force | Out-Null
          Move-Item -Path $dllPath -Destination (Join-Path $nativeDir "core.dll") -Force
          Move-Item -Path $libPath -Destination (Join-Path $nativeDir "core.lib") -Force

      - name: Build Radiance JAR (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd "${{ github.workspace }}/Radiance"
          ./gradlew build -Pplatform=linux --no-daemon

      - name: Build Radiance JAR (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\Radiance"
          .\gradlew.bat build -Pplatform=windows --no-daemon

      - name: Verify JAR contents (Linux)
        if: matrix.platform == 'linux'
        run: |
          JAR_FILE=$(find "${{ github.workspace }}/Radiance/build/libs" -name '*linux.jar' -not -name '*sources*' -not -name '*dev*' | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Linux JAR not found"
            exit 1
          fi

          SHADER_COUNT=$(jar tf "$JAR_FILE" | grep -c '\.spv$' || echo "0")
          if [ "$SHADER_COUNT" -eq 0 ]; then
            echo "ERROR: No shaders found in Linux JAR"
            exit 1
          fi

          jar tf "$JAR_FILE" | grep 'libcore.so' >/dev/null || { echo "ERROR: libcore.so not in Linux JAR"; exit 1; }

      - name: Verify JAR contents (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $jarFile = Get-ChildItem "$env:GITHUB_WORKSPACE\Radiance\build\libs\*windows.jar" |
            Where-Object { $_.Name -notmatch 'sources|dev' } |
            Select-Object -First 1

          if (-not $jarFile) {
              throw "Windows JAR not found"
          }

          $entries = & jar tf $jarFile.FullName
          $shaderCount = ($entries | Where-Object { $_ -match '\.spv$' } | Measure-Object).Count
          if ($shaderCount -eq 0) {
              throw "No shaders found in Windows JAR"
          }

          if (-not ($entries | Where-Object { $_ -match 'core\.dll$' })) {
              throw "core.dll not found in Windows JAR"
          }
          if (-not ($entries | Where-Object { $_ -match 'core\.lib$' })) {
              throw "core.lib not found in Windows JAR"
          }

      - name: Upload platform JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radiance-${{ matrix.platform }}
          path: Radiance/build/libs/*${{ matrix.platform }}.jar
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built JAR artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Radiance-*
          path: release-assets
          merge-multiple: true

      - name: Upload JARs to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          TAG="${{ github.event.release.tag_name }}"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG not found, creating one from tag"
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi

          shopt -s nullglob
          JARS=(release-assets/*linux.jar release-assets/*windows.jar)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "ERROR: No platform JARs found to upload"
            exit 1
          fi

          for JAR_FILE in "${JARS[@]}"; do
            JAR_NAME=$(basename "$JAR_FILE")
            echo "Uploading $JAR_NAME to release $TAG"
            gh release upload "$TAG" "$JAR_FILE" --repo "$REPO" --clobber
          done
